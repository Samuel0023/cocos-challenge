services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cocos
      POSTGRES_PASSWORD: cocos
      POSTGRES_DB: cocos
    ports:
      - '5432:5432'
    volumes:
      - ./db/database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
      - ./db/migrations/001_constraints_and_analytics.sql:/docker-entrypoint-initdb.d/02-migration.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cocos -d cocos']
      interval: 2s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    profiles: ['api']
    build: .
    environment:
      DATABASE_URL: postgres://cocos:cocos@postgres:5432/cocos
      VALKEY_URL: redis://valkey:6379
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

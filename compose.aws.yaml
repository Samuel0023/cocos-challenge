# Used by `make up`: runs the API with SNS/SQS against AWS Emulator.
# The API joins the emulator's network namespace because the emulator's certificate only covers
# 127.0.0.1 and localhost. postgres and valkey still resolve by service name from there, since the
# emulator is on the default network. A service sharing a namespace cannot publish ports, so the
# emulator publishes the API port.
services:
  aws-emulator:
    ports:
      - '3000:3000'

  api:
    network_mode: service:aws-emulator
    ports: !reset []
    environment:
      AWS_ENABLED: 'true'
      CONSUMER_ENABLED: 'true'
      AWS_ENDPOINT_URL: https://127.0.0.1:9297
      AWS_REGION: us-east-1
      ORDER_EVENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:order-events
      ORDER_EVENTS_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/000000000000/order-events-queue
      AWS_SHARED_CREDENTIALS_FILE: /aws-emulator/9297/emulator_credentials
      AWS_CONFIG_FILE: /aws-emulator/9297/config
      NODE_EXTRA_CA_CERTS: /aws-emulator/9297/ca.pem
      AWS_EC2_METADATA_DISABLED: 'true'
    volumes:
      - ./.aws-emulator:/aws-emulator:ro
    depends_on:
      aws-init:
        condition: service_completed_successfully
